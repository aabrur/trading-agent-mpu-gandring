name: Offline validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTENV_CONFIG_PATH: __isolated_no_env__
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run stage-gate -- --stage S5 --evidence-dir "${RUNNER_TEMP}/mpu-stage-evidence"
      - name: Upload independent verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpu-stage-gate-evidence
          path: ${{ runner.temp }}/mpu-stage-evidence
          if-no-files-found: warn
          retention-days: 30
